services:
  sommelier:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      SOMMELIER_DATA_DIR: /data/sessions
    secrets:
      - openrouter_api_key
    volumes:
      - sommelier_sessions:/data/sessions
    restart: unless-stopped

secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt

volumes:
  sommelier_sessions:
