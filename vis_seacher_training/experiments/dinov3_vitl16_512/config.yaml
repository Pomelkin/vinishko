desc: "DINOv3 ViT-B/16, вход 512×512, CLS ⊕ GeM → 512, sub-center ArcFace на WineSensed"
seed: 42

trainer_params:
  accelerator: "cuda"
  devices: [ 0 ]
  strategy:
    type: "single_device" # для двух карт: devices: [0, 1] и type: "ddp"
  max_epochs: 15
  precision: bf16-mixed
  val_check_interval: 0.25
  log_every_n_steps: 25
  accumulate_grad_batches: 1

hyperparams:
  optimizer:
    type: "AdamW"
    betas: [ 0.9, 0.999 ]
  lr:
    scheduler_type: "cosine"
    warmup_ratio: 0.05
    warmup_value: 1e-6
    base_value: 1e-3 # голова и центры ArcFace
    final_value: 1e-5
  weight_decay:
    base_value: 0.05
  grad_clip_val: 1.0
  backbone_lr_multiplier: 0.02 # бэкбон учится на 2e-5

checkpointing:
  save_top_k: 3
  monitor: "val_recall1" # recall@1 вина, одно фото класса в галерее с шумом из не-вина
  mode: "max"
  filename: "{epoch:02d}-{step}-{val_recall1:.4f}"
  save_weights_only: true

model:
  backbone: "facebook/dinov3-vitl16-pretrain-lvd1689m"
  patch_size: 16
  embed_dim: 512
  gem_p: 3.0
  attn_implementation: "sdpa" # либо flash_attention_2: только с половинной точностью, precision bf16-mixed
  freeze_backbone: false
  gradient_checkpointing: false

loss:
  k: 3
  s: 30.0
  m_a: 0.5
  m_b: 0.05
  m_lambda: 0.25

data:
  datasets_dir: /home/pomelk1n/Workspace/vinishko/datasets/visual-encoder
  input_size: [ 512, 512 ] # высота и ширина, обе кратны model.patch_size
  batch_size: 64
  eval_batch_size: 128
  num_workers: 12
  log_train_images_every_n_epochs: 1
  eval:
    max_val_images: 20000
    max_distractors: 5000
    max_negatives: 5000
  augmentations:
    enabled: true
    view:
      pad_y_range: [ 0.0, 0.6 ]
      full_bottle_prob: 0.05
      edge_jitter_prob: 0.8
      edge_jitter: 0.08 # по высоте, в обе стороны
      edge_jitter_x: 0.04 # по ширине, только наружу
      rotate_prob: 0.6
      rotate_deg: 15
      keep_background_prob: 0.2
      mask_jitter: [ 0.5, 2.0 ]
    perspective: { prob: 0.4, scale: [ 0.02, 0.07 ] }
    occlusion: { prob: 0.35, max_occluders: 3, size_range: [ 0.08, 0.35 ], min_label_visible: 0.6, min_bottle_visible: 0.6, cut_from_mask_prob: 0.5 }
    label_noise: { prob: 0.4 }
    glare: { prob: 0.3, max_blobs: 2, intensity: [ 0.35, 0.95 ], size_range: [ 0.05, 0.25 ], strip_prob: 0.4, strip_width: [ 0.02, 0.07 ] }
    mask_defects: { prob: 0.3, truncate_prob: 0.4, max_truncate: 0.7, min_label_visible: 0.5, side_cut_prob: 0.5, max_side_cuts: 2, side_cut_size: [ 0.05, 0.25 ], rough_prob: 0.5, rough_sigma: [ 0.01, 0.03 ], rough_amp: [ 0.15, 0.4 ] }
    exposure: { prob: 0.25, dark_prob: 0.65, dark_gain: [ 0.25, 0.7 ], bright_gain: [ 1.3, 2.2 ], bright_lift: 40, gradient_prob: 0.5 }
    photometric: { color_prob: 0.8, white_balance_prob: 0.3, shadow_prob: 0.15, shake_prob: 0.05, rare_color_prob: 0.03, blur_prob: 0.25, noise_prob: 0.25, sharpen_prob: 0.1 }
    degrade: { downscale_prob: 0.35, downscale_range: [ 0.12, 0.8 ], small_jpeg_prob: 0.5, small_jpeg_quality: [ 30, 80 ], jpeg_prob: 0.4, jpeg_quality: [ 25, 90 ] }
    resize_interpolations: [ nearest, linear, cubic, area, lanczos ]
    random_pad_position: true
