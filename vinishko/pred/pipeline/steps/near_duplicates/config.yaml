# NDR v5. OPENROUTER_MODEL из .env может перекрыть model.
openrouter:
  model: deepseek/deepseek-v4.1-flash
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  http_referer_env: OPENROUTER_SITE_URL
  app_title_env: OPENROUTER_APP_TITLE
  user_agent: vinishko-pipeline/1
  routing:
    routing_mode: null
    order: []
    only: [ together ]
    ignore: []
    allow_fallbacks: false
    require_parameters: true
    data_collection: null
    zdr: null
    quantizations: []
    max_price: null

generation:
  temperature: 0.0
  top_p: null
  top_k: null
  min_p: null
  frequency_penalty: null
  presence_penalty: null
  repetition_penalty: null
  max_completion_tokens: 4096
  generations: 1
  seed: null
  stop: []
  image_detail: original
  reasoning_effort:
    # рассуждения модели до ответа по кругам: none | minimal | low | medium | high; кандидатов модель перебирает про себя, но дольше
    group: none # проба 2026-09-28 на test_000098: low в группе из 2 позиций — 1294 токена рассуждений и 13.9 с, круг групп держит всё фото
    final: none # там же финал из 2: 263 токена, 2.0 с — около секунды сверху
  reasoning_exclude: false

execution:
  timeout_seconds: 60.0
  retries: 3 # повторы после 429 и 500/502/503/504: пауза 0.5, 1, 2 с плюс до 1 с случайно, Retry-After сервера главнее; все попытки укладываются в timeout_seconds
  concurrency: 8 # сколько запросов к модели идёт одновременно на резолвер; одно фото даёт до 5 запросов в круге групп (top_groups 5), так что 8 его не тормозит, а всплеск из нескольких бутылок или прогонов ждёт в очереди
  candidate_order_seed: 0
  limit: null
