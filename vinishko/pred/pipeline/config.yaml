# Конфиг оркестратора. Конфиги шагов лежат рядом с шагами: steps/normalization/normalize.toml, steps/vis_searcher/config.yaml, steps/near_duplicates/config.yaml.
# Относительные пути считаются от этого файла, ../../../ — корень репозитория.
catalog: # CSV каталога: описание позиции в ответе API и карточки позиций второму уровню
  # kind: local
  # path: ../catalog.csv # копия datasets/hack-vine/catalog/catalog.csv, едет вместе с кодом приложения
  kind: s3
  endpoint: https://s3.ru-6.storage.selcloud.ru
  bucket: vino
  key: catalog-origin/catalog.csv
slug_column: Slug # колонка с идентификатором позиции, он же slug в коллекции поиска
