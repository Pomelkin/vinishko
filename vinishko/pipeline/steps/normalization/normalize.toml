# Конфиг нормализации бутылок вина.
# Любой параметр переопределяется из командной строки: --set crop.padding_x=0.15 --set background.mode="none"
# Пути считаются относительно папки этого файла.

[segmentation]
model = "sam3.pt"
prompt = "wine bottle"
conf = 0.3                  # минимальная уверенность кандидата
imgsz = 1008
max_side = 1600             # до этого размера кадр сжимается перед моделью

[fallback]
full_image = true           # бутылка не найдена: в выход идёт целое фото, mode = "full_image"
min_aspect = 2.0            # маска ненадёжна (длина бутылки меньше стольких её ширин): bbox без поворота и блюра, mode = "bbox"

[label]
required = false            # true = бутылка без хорошей этикетки не вырезается; false = вырезается, причина пишется в label_status
prompt = "wine label"       # отдельный запрос к SAM3 на тех же признаках картинки, ~75 мс
exclude_prompts = ["bottle cap", "bottle neck"]  # логотип на крышке и кольцевая этикетка на горлышке не считаются
min_conf = 0.4              # этикетки ниже этой уверенности не учитываются; не ниже segmentation.conf
min_cover = 0.10            # no_label: этикетка закрывает меньшую долю площади маски бутылки
min_fill = 0.3              # label_partial: этикетка закрывает меньшую долю полосы бутылки на своей высоте (повёрнута боком, закрыта)
min_sharpness = 300         # label_blurry: этикетка размыта, в расфокусе или слишком мелкая, чтобы читаться
min_length_ratio = 2.6      # bottle_hidden: видимая длина бутылки меньше стольких её ширин (корпус скрыт, видно горлышко)
min_position = 0.3          # label_off_body: центр этикетки ближе к горлышку, чем эта доля длины бутылки
min_label_px = 40           # label_too_small: короткая сторона этикетки меньше стольких пикселей оригинала

[label_crop]
refine_min_gain = 1.5       # второй проход SAM3 по вырезке бутылки, если разрешение этикетки вырастет хотя бы во столько раз
refine_margin = 0.05        # запас вокруг бутылки для второго прохода, доля большей стороны бутылки
padding = 0.03              # запас вокруг этикетки в вырезке, доля её ширины и высоты
min_width_frac = 0.3        # не считать этикеткой полоски уже этой доли ширины бутылки (акцизные марки)

[selection]
calibration = "calibration.json"
threshold = -1.0            # -1 = порог из калибровки; ниже порог = выше полнота и ниже точность
max_bottles = 0             # 0 = брать все прошедшие порог
min_bottle_px = 0           # отбрасывать бутылки ниже этой высоты в пикселях оригинала; 0 = не проверять

[orientation]
enabled = true              # false = не поворачивать, только кроп
neck = "profile"            # profile = горлышко на узком конце маски; up = горлышко там, где конец выше в кадре
min_profile_contrast = 0.15 # если концы маски почти одной ширины, горлышко определяется как для up
upright_within_deg = 30.0   # ось ближе к вертикали, чем на столько градусов: горлышко = верхний конец (на фото бутылки не стоят вверх ногами); 0 = выключить

[crop]
padding_x = 0.10            # запас слева и справа, доля ширины бутылки
padding_y = 0.10            # запас сверху и снизу, доля высоты бутылки
avoid_neighbors = true      # запас не заходит в боксы других кандидатов; урезается симметрично, бутылка остаётся по центру
border = "replicate"        # чем заполнять область за краем исходника: replicate, reflect, constant

[background]
mode = "blur"               # blur, color, none
blur_sigma = 0.03           # сила размытия, доля большей стороны кропа
color = [255, 255, 255]     # для mode = "color"
feather = 0.004             # растушёвка края маски, доля большей стороны кропа
dilate = 0.003              # расширение маски перед растушёвкой, чтобы не съесть край бутылки

[output]
dir = "out"
format = "jpg"              # jpg, png, webp
quality = 92
height = 0                  # 0 = родное разрешение кропа, иначе масштаб до этой высоты
