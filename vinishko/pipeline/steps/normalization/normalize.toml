# Конфиг нормализации бутылок вина.
# Любой параметр переопределяется из командной строки: --set crop.padding_y=0.15 --set background.mode="none"
# Пути считаются относительно папки этого файла.

[segmentation]
# model = "sam3.pt"         # путь к весам; без него SAM3 берётся из кэша пользователя и при первом запуске скачивается туда
prompt = "wine bottle"
conf = 0.3                  # минимальная уверенность кандидата
imgsz = 1008                # сторона входа SAM3, берётся кратной 336; 672 вдвое быстрее и годится для фото до 700 px, см. README
max_side = 1600             # до этого размера кадр сжимается перед моделью
device = "auto"             # auto | cpu | cuda:<индекс>; переменная NORMALIZER_DEV перекрывает; auto — cuda:0 при доступной CUDA, иначе cpu. normalize_dataset задаёт видимость карт сам и ждёт auto

[fallback]
min_aspect = 2.0            # бутылка короче стольких своих ширин: ось PCA неустойчива, кроп без поворота, angle = 0

[label]                     # бутылка без годной основной этикетки не вырезается, причина — NormalizationReason в normalize.py
prompt = "wine label"       # идёт в SAM3 одним батчем с промптом бутылки и exclude_prompts на тех же признаках картинки, ~18 мс на промпт
exclude_prompts = ["bottle cap", "bottle neck"]  # логотип на крышке и кольцевая этикетка на горлышке не считаются
min_conf = 0.4              # этикетки ниже этой уверенности не учитываются; не ниже segmentation.conf
min_cover = 0.10            # no_label: этикетка закрывает меньшую долю площади маски бутылки
min_fill = 0.3              # label_partial: этикетка закрывает меньшую долю полосы бутылки на своей высоте, то есть повёрнута боком или закрыта
min_sharpness = 100         # label_blurry: этикетка размыта, в расфокусе или слишком мелкая, чтобы читаться; 300 отбрасывал читаемые размытые фото (Martini при 195)
min_length_ratio = 2.6      # бутылка видна целиком, если её длина не меньше стольких ширин; только у такой проверяется min_position
min_position = 0.3          # not_a_label: центр наклейки ближе к горлышку, чем эта доля длины бутылки
min_label_px = 40           # label_too_small: короткая сторона этикетки меньше стольких пикселей оригинала

[label_crop]
refine_min_gain = 1.5       # второй проход SAM3 по вырезке бутылки, если разрешение этикетки вырастет хотя бы во столько раз
refine_margin = 0.05        # запас вокруг бутылки для второго прохода, доля большей стороны бутылки
padding = 0.03              # запас вокруг этикетки в вырезке, доля её ширины и высоты
min_part_frac = 0.1         # островки маски этикетки мельче этой доли её основного пятна отбрасываются: это куски соседнего текста и тиснения
min_width_frac = 0.3        # not_a_label: полоски уже этой доли ширины бутылки, то есть акцизные марки, этикеткой не считаются

[selection]
calibration = "calibration.json"
threshold = -1.0            # -1 = порог из калибровки; ниже порог = выше полнота и ниже точность
max_bottles = 1             # over_limit: не больше стольких годных бутылок на кадр; 0 = брать все. Пайплайну нужна ровно одна
min_bottle_px = 0           # bottle_too_small: бутылка ниже этой высоты в пикселях оригинала; 0 = не проверять
bypass = false             # true: если годных бутылок нет, дальше идёт весь кадр как одна бутылка со score 0, отказы остаются в разметке

[orientation]
enabled = true              # false = не поворачивать, только кроп
neck = "profile"            # profile = горлышко на узком конце маски; up = горлышко там, где конец выше в кадре
min_profile_contrast = 0.15 # если концы маски почти одной ширины, горлышко определяется как для up
upright_within_deg = 30.0   # ось ближе к вертикали, чем на столько градусов: горлышко = верхний конец (на фото бутылки не стоят вверх ногами); 0 = выключить

[crop]                      # кроп для пайплайна: полоса бутылки на высоте основной этикетки; по ширине всегда вся бутылка
padding_y = 0.20            # запас сверху и снизу, доля высоты этикетки; окно не выше маски бутылки, большое значение даёт всю бутылку
border = "replicate"        # чем заполнять область за краем исходника: replicate, reflect, constant

[background]
mode = "color"              # color, blur, none; заливка делает фон одинаковым у запроса и у каталога на белом, блюр оставляет цвет окружения
blur_sigma = 0.03           # сила размытия, доля большей стороны кропа
color = [124, 116, 104]     # для mode = "color"; среднее нормализации ImageNet, на входе энкодера это нули
feather = 0.004             # растушёвка края маски, доля большей стороны кропа
dilate = 0.003              # расширение маски перед растушёвкой, чтобы не съесть край бутылки

[output]
dir = "out"
format = "jpg"              # jpg, png, webp
quality = 92
height = 0                  # 0 = родное разрешение кропа, иначе масштаб до этой высоты
