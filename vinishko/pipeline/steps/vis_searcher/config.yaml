# Визуальный поиск: настройки по умолчанию. Относительные пути считаются от этого файла, ../../../../ — корень репозитория.
model: pomelk1n/siglipus-twinturbo-gguf-umer # репозиторий Hugging Face с экспортом энкодера: SigLIP2 so400m/14 384; DINO — pomelk1n/qwopus-twinturbo-gguf-umer-vitl16-1024
revision: null # ревизия репозитория; коллекция помнит свою и с другой не работает
device: auto # auto | cpu | cuda:<индекс>; переменная VIS_SEARCHER_DEV перекрывает; auto — cuda:0 при доступной CUDA, иначе cpu
encoder_input: [ crop, box_crop ] # входы энкодера, по пространству векторов на каждый: crop — окно этикетки с залитым фоном, box_crop — вся бутылка как на фото; два входа — гибрид, скор = среднее косинусов; коллекцию собирать тем же набором
batch_size: 16 # потолок батча энкодера, для TensorRT — профиль engine
top_k: 10 # сколько ближайших векторов брать из каждого пространства

qdrant:
  collection: catalog_siglip2_hybrid
  host: pomelka.pro
  port: 443
  https: true # true для сервера за TLS, ключ API — в окружении QDRANT_API_KEY
  # path: ../../../../.qdrant                           # встроенный qdrant без сервера, для локальной отладки

search:
  # mode: groups # группы одинакового дизайна: скор группы — лучший скор её позиций из top_k
  # top_groups: 3
  # group_threshold: 0.7
  mode: top_n # либо просто top_k позиций
  cosine_threshold: 0.7 # если лучший скор ниже, кандидатов нет. Гибрид SigLIP2 на тесте 2026-09-27: 0.70 — ни одного ложного отказа, 23% чужих режется сразу, остальных отсеивает VLM-реранкер; без реранкера максимум точности при 0.77 (recall@1 85.6%, ложных 5.6%, верных отказов 70%); 0.5 — выключить отказ для замеров

images:
  kind: local # кропы коллекции, которые положил build_catalog
  dir: ../../../../datasets/catalog
  # kind: s3
  # endpoint: https://s3.ru-6.storage.selcloud.ru
  # bucket: vino
  # prefix: catalog

cache_dir: ~/.cache/vino # engine TensorRT и картинки из S3
debug_path: null # директория для разбора глазами: на каждый вызов поддиректория с меткой времени
