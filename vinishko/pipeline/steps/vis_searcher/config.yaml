# Визуальный поиск: настройки по умолчанию. Относительные пути считаются от этого файла, ../../../../ — корень репозитория.
model: pomelk1n/qwopus-twinturbo-gguf-umer-vitl16-1024 # модель новой коллекции из main
revision: null # ревизия репозитория; коллекция помнит свою и с другой не работает
device: auto                                            # auto | cpu | cuda:<индекс>; переменная VIS_SEARCHER_DEV перекрывает; auto — cuda:0 при доступной CUDA, иначе cpu
batch_size: 16 # потолок батча энкодера, для TensorRT — профиль engine
cpu_batch_size: 1 # безопасный потолок на машине с 16 ГБ ОЗУ; 2 быстрее при достаточной свободной памяти
top_k: 1 # ближайшая позиция задаёт группу для NDR

qdrant:
  collection: catalog_vitl16_1024
  host: pomelka.pro
  port: 443
  https: true # true для сервера за TLS, ключ API — в окружении QDRANT_API_KEY
  # path: ../../../../.qdrant                           # встроенный qdrant без сервера, для локальной отладки

search:
  mode: groups # группы одинакового дизайна: скор группы — лучший косинус её позиций из top_k
  top_groups: 1
  group_threshold: -1.0 # всегда брать группу top-1; отказ внутри группы решает NDR
  # mode: top_n                                         # либо просто top_k позиций
  # cosine_threshold: 0.5                               # если лучший косинус ниже, кандидатов нет

images:
  kind: local # готовые изображения кандидатов для VLM из S3 vino/catalog/
  dir: ../../../../datasets/local/normalized/catalog/images

reference_images:
  kind: local # резервные оригинальные Эталоны для старых записей Qdrant без image_crop=bottle_box
  dir: ../../../../datasets/local/catalog/images
catalog_csv: ../../../../datasets/local/catalog/catalog.csv # полные карточки для NDR v5

cache_dir: ~/.cache/vino # engine TensorRT и картинки из S3
debug_path: null # директория для разбора глазами: на каждый вызов поддиректория с меткой времени
