# CPU: docker compose up -d --build
# GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.override.yml up -d --build
# Переменные берутся из .env в корне (образец — .env.example); в контейнер приложения уходят только перечисленные ниже.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY не задан, положите его в .env}
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app

  app:
    image: vinishko-app:cpu
    build:
      context: .
      dockerfile: docker/app-cpu.Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - '8000:8000'
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY не задан, положите его в .env}
      openrouter_http_proxy: ${openrouter_http_proxy:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY не задан, положите его в .env}
      # S3 Selectel: картинки коллекции и снапшоты qdrant (vis_searcher/config.yaml)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID не задан, положите его в .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY не задан, положите его в .env}
    volumes:
      # веса SAM3, модель поиска с Hugging Face, engine TensorRT, картинки из S3 — скачиваются при первом старте
      - cache:/root/.cache
      - sessions:/data/sessions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      # первый старт качает SAM3 (3.4 ГБ) и модель, восстанавливает коллекцию из снапшота
      start_period: 15m
    networks:
      - app

  frontend:
    image: vinishko-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # http — запросы в приложение через /api; фронт пока не переведён на контракт API, поэтому mock
        VITE_API_MODE: mock
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '8080:80'
    networks:
      - app

volumes:
  qdrant_storage:
  cache:
  sessions:

networks:
  app:
    driver: bridge
