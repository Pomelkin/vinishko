[project]
name = "vinishko"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "torch==2.10.0",
    "transformers>=5.17.0",
    "ultralytics>=8.4.154",
    "clip",
    "rich-click>=1.9.9",
    "scikit-learn>=1.9.1",
    "timm>=1.0.29",
    "kostyl-toolkit[ml]>=0.2.6",
    "open-clip-torch",
    "torchvision==0.25.0",
    "numba>=0.67.0",
]
[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "polars>=1.44.2",
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "kaggle>=2.2.4",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "rich-click>=1.9.9",
    "tqdm>=4.70.1",
    "dvc[s3]>=3.67.1",
]
flash-inference = [
    "causal-conv1d",
    "flash-attn",
    "flash-linear-attention>=0.5.2",
    "late-interaction-kernels>=0.4.5",
    "tensorrt>=11.3.0.99",
]
vis-searcher-training = [
    "accelerate>=1.15.0",
    "albumentations>=2.0.8",
    "clearml[s3]>=2.1.12",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "onnxruntime-gpu>=1.30.0",
    "onnxscript>=0.7.2",
    "plotly>=7.1.0",
    "tensorboard>=2.21.0",
]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"

[tool.ruff.lint]
exclude = [
  ".venv",
  "build",
  "dist",
  "__pycache__",
  "migrations",
  "notebooks",
  "tests",
  "./train_val_scripts/form_understanding",
]
select = [
  "ANN", # Enforce type annotations
  "C90", # Enforce maximum cyclomatic complexity
  "D",   # Enforce docstrings
  "NPY", # Enforce numpy style
  "E",   # Pycodestyle formatting errors
  "F",   # Pyflakes logic errors
  "B",   # Flake8-bugbear suspicious code patterns
  "UP",  # Pyupgrade modern Python syntax
  "N",   # Pep8-naming correct class/function names
  "S",   # Flake8-bandit security issues
  "C4",  # Flake8-comprehensions better comprehensions
  "T20", # Flake8-print forbid debug print statements
  "TID", # Flake8-tidy-imports forbid relative imports
  "A",   # Flake8-builtins avoid shadowing built-ins
  "PTH", # Flake8-use-pathlib prefer pathlib over os.path
  "RUF", # Ruff-specific rules
  "Q",   # quotes checks
  "PERF", # Performance checks
  "SIM", # Simplicity checks
  "I",   # Import checks
  "W",    # Pycodestyle warnings
  "T10",  # Flake8-debugger forbid breakpoints
  "ERA",  # Eradicate commented-out code
  "ISC",  # Implicit string concatenation
  "PIE",  # Flake8-pie misc lints
  "PGH",  # Pygrep-hooks require specific noqa codes
  "RSE",  # Flake8-raise cleaner raises
  "FLY",  # Static string joins to f-strings
  "ICN",  # Import conventions (np, pd, plt)
  "DTZ",  # Naive datetime usage
  "FURB", # Refurb modern Python idioms
  "PLE",  # Pylint errors
  "PLW",  # Pylint warnings
]


ignore = [
  "I",
  "ANN002", # Missing type annotation for *args
  "ANN003", # Missing type annotation for **kwargs
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
  "I001",   # isort found an import in the wrong position
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D203",   # 1 blank line required before class docstring
  "D212",   # Multi-line docstring summary should start at the first line
  "D401",   # First line of docstring should be in imperative mood
  "E501",   # Line too long
  "N806",   # Variable in function should be lowercase
  "N803",   # Argument name should be lowercase
  "N812",   # Import alias should be lowercase
  "D105",  # Missing docstring in magic method
  "N817",   # CamelCase import aliased as acronym
  "S311",  # Standard pseudo-random generators are not suitable for security/cryptographic purposes
  "PIE790", # Unnecessary placeholder
  "W293",  # Blank line contains whitespace
  "T201",  # print found
  "CPY001", # missing copyright
  "PLR1711", # useless return statements
  "EM102", # f-strings in exception constructors
  "EM101", # strings in exception constructors
  "TRY003", # Long messages in vanilla exception REMOVE IN NEW PROJECT!!!
  "RET504", # useless return statements
  "PLR2004",
  "ERA001",
  "PLR0913",
  "PLR0917",
  "FBT001",
  "FBT002",
  "G004",
  "COM812",
  "RET502",
  "TC006",
  "TC001",
  "TC002",
  "D",
  "RUF001", # Кириллица в строках: язык проекта
  "RUF002", # Кириллица в докстрингах
  "RUF003", # Кириллица в комментариях
]
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
  "src",
  "app",
  "core",
]
combine-as-imports = false
force-single-line = true
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.uv]
# albumentations тянет opencv-python-headless, а тот ставит свой cv2 поверх opencv-python
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
causal-conv1d = { path = "wheels/causal_conv1d-1.6.2.post1-cp313-cp313-linux_x86_64.whl" }
flash-attn = { path = "wheels/flash_attn-2.8.3-cp313-cp313-linux_x86_64.whl" }
open-clip-torch = { git = "https://github.com/tulip-berkeley/open_clip" }
