server {
    listen 80;
    root /usr/share/nginx/html;
    # фронт пускает фото до 20 МБ
    client_max_body_size 25m;

    # /api сохраняется: это адаптированный контракт React, /recognize остаётся для оценки.
    location /api/ {
        # DNS docker: имя app ищется при запросе, поэтому nginx стартует и без поднятого приложения
        resolver 127.0.0.11 valid=30s;
        set $app http://app:8000;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # распознавание с моделью второго уровня занимает десятки секунд
        proxy_read_timeout 1800s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # маршруты SPA: /scan/..., /wine/...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
